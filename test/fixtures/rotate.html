<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  * { margin: 0; box-sizing: border-box; }
  body { font-family: Inter, sans-serif; background: #f4f5f7; }
  .stage { position: relative; width: 320px; height: 240px; }
  .card {
    position: absolute; left: 100px; top: 70px;
    width: 120px; height: 100px; border-radius: 12px;
    background: #4f46e5; box-shadow: 0 8px 20px rgba(79,70,229,.4);
    transform: rotate(-12deg);
  }
  .badge {
    position: absolute; left: 40px; top: 40px;
    width: 60px; height: 24px; border-radius: 999px; background: #ef4444;
    transform: rotate(20deg);
  }
</style></head><body>
  <div class="stage" data-figma-component="Rotated">
    <div class="card"></div>
    <div class="badge"></div>
  </div>
</body></html>
