<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  * { margin: 0; box-sizing: border-box; }
  body { font-family: Inter, sans-serif; }
  .row { display: flex; gap: 16px; }
  .avatar { width: 64px; height: 64px; background: #4f46e5; clip-path: circle(50%); }
  .divider { width: 120px; height: 60px; background: #10b981; clip-path: polygon(0 0, 100% 0, 100% 70%, 0 100%); }
</style></head><body>
  <div class="row" data-figma-component="Clips">
    <div class="avatar"></div>
    <div class="divider"></div>
  </div>
</body></html>
